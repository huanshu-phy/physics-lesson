<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <rect width="720" height="480" fill="#ffffff"/>
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="100" y1="400" x2="660" y2="400"/>
    <line x1="100" y1="400" x2="100" y2="60"/>
    <polygon points="660,400 648,395 648,405" fill="#111827" stroke="none"/>
    <polygon points="100,60 95,72 105,72" fill="#111827" stroke="none"/>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <line x1="100" y1="310" x2="650" y2="310" stroke-dasharray="5 5"/>
    <line x1="100" y1="220" x2="650" y2="220" stroke-dasharray="5 5"/>
    <line x1="100" y1="130" x2="650" y2="130" stroke-dasharray="5 5"/>
    <line x1="240" y1="70" x2="240" y2="400" stroke-dasharray="5 5"/>
    <line x1="380" y1="70" x2="380" y2="400" stroke-dasharray="5 5"/>
    <line x1="520" y1="70" x2="520" y2="400" stroke-dasharray="5 5"/>
  </g>
  <g stroke="#dc2626" stroke-width="4" fill="none">
    <line x1="100" y1="400" x2="580" y2="76"/>
  </g>
  <g fill="#dc2626">
    <circle cx="240" cy="310" r="7"/>
    <circle cx="380" cy="220" r="7"/>
    <circle cx="520" cy="130" r="7"/>
  </g>
  <g font-family="SimHei, sans-serif" font-size="18" fill="#374151">
    <text x="88" y="406" text-anchor="end">0</text>
    <text x="240" y="425" text-anchor="middle">1.0</text>
    <text x="380" y="425" text-anchor="middle">2.0</text>
    <text x="520" y="425" text-anchor="middle">3.0</text>
    <text x="88" y="316" text-anchor="end">0.10</text>
    <text x="88" y="226" text-anchor="end">0.20</text>
    <text x="88" y="136" text-anchor="end">0.30</text>
    <text x="660" y="430" text-anchor="end">U / V</text>
    <text x="60" y="70" text-anchor="start">I / A</text>
  </g>
  <g font-family="SimHei, sans-serif" font-size="18" fill="#dc2626">
    <text x="470" y="120">I = U / R</text>
    <text x="470" y="150">（R = 10 Ω）</text>
  </g>
  <text x="360" y="40" font-family="SimHei, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#111827">电流与电压的关系（电阻一定时成正比）</text>
